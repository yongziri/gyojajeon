name: Build Android APK (P.E.A.C.E.)

# 게임 콘텐츠를 APK 안에 내장(Capacitor)해서 빌드합니다.
#  · 로컬에 Android 도구가 없어 GitHub 클라우드 러너에서 빌드합니다.
#  · 완성된 APK는 실행 결과(Actions) 페이지의 Artifacts 에서 내려받습니다.
#  · USB 제출용 — APK 안에 실제 게임이 들어 있어 인터넷 없이 실행됩니다.

on:
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능
  push:
    branches: [mobile]
    paths:                  # 게임 내용/빌드 설정이 바뀔 때 자동 재빌드
      - 'src/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'vendor/**'
      - 'assets/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (mobile 브랜치 게임 파일)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Bundle game files into www/
        run: |
          rm -rf www
          mkdir -p www
          cp index.html manifest.webmanifest www/
          cp -r src vendor assets www/
          echo "=== www/ 내용 ===" && ls -1 www && du -sh www

      - name: Prepare Capacitor (clean package.json + install)
        run: |
          cat > package.json <<'JSON'
          { "name": "peace-apk", "version": "1.0.0", "private": true }
          JSON
          npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6 @capacitor/keyboard@^6

      - name: Add Android platform & sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PEACE.apk
          ls -lh PEACE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PEACE-APK
          path: PEACE.apk
          if-no-files-found: error
