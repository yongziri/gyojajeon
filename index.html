<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1a0e08" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="assets/icons/icon-192.png" />
  <title>P.E.A.C.E. — 통(通)하는 국제 분쟁 탐구하기</title>
  <style>
    /* MonaS 픽셀 한글 폰트 (Monad ABXY, SIL OFL 라이선스 — 자유 사용)
       · MonaS12TextKR : 한국어 본문 최적화 12px
       · MonaS12-Bold  : 제목·강조 (영문+일부 한글, 한글은 TextKR로 fallback) */
    @font-face {
      font-family: 'MonaS';
      src: url('assets/fonts/MonaS12TextKR.woff2') format('woff2');
      font-weight: normal; font-style: normal; font-display: block;
    }
    @font-face {
      font-family: 'MonaS';
      src: url('assets/fonts/MonaS12-Bold.woff2') format('woff2');
      font-weight: bold; font-style: normal; font-display: block;
    }
    /* 영문 강조용 (한글이 없는 부분은 MonaS12 사용) */
    @font-face {
      font-family: 'MonaS12';
      src: url('assets/fonts/MonaS12.woff2') format('woff2');
      font-weight: normal; font-style: normal; font-display: block;
    }
    @font-face {
      font-family: 'MonaS12';
      src: url('assets/fonts/MonaS12-Bold.woff2') format('woff2');
      font-weight: bold; font-style: normal; font-display: block;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #3a2f1f;
      overflow: hidden;
      font-family: 'MonaS', 'Malgun Gothic', sans-serif;
      /* 8비트 픽셀 렌더링 보장 */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
      /* iOS Safari/Chrome 노치·홈바 안전영역 */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-sizing: border-box;
    }

    /* 게임 컨테이너 — 8비트 CRT 느낌의 무대 */
    #game {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      /* 모바일 주소창 변동에 강한 동적 viewport */
      width: 100dvw;
      height: 100dvh;
      /* 좌우 여백 — 게임 갈색 톤과 자연스럽게 이어짐 */
      background:
        radial-gradient(ellipse at center,
          rgba(40,30,15,0) 0%,
          rgba(0,0,0,0.35) 100%),
        #3a2f1f;
    }
    #game canvas {
      image-rendering: pixelated !important;
      image-rendering: crisp-edges !important;
      /* 약한 채도/대비 보정으로 NES 톤 흉내 */
      filter: contrast(1.08) saturate(1.10);
      /* Phaser autoCenter 백업 — 부모 안에서 강제 중앙 정렬 */
      position: absolute !important;
      inset: 0 !important;
      margin: auto !important;
      display: block !important;
    }

    /* 스캔라인 — 게임 캔버스 위에 가는 가로줄 */
    #crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(0,0,0,0.18) 0px,
          rgba(0,0,0,0.18) 1px,
          rgba(0,0,0,0.00) 2px,
          rgba(0,0,0,0.00) 3px
        );
      mix-blend-mode: multiply;
    }
    /* 끝부분 살짝 어둡게 (비네트) */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0) 50%,
        rgba(0,0,0,0.55) 100%);
    }

    .preload-font {
      position: absolute; left: -9999px; top: -9999px; visibility: hidden;
    }

    /* 참가 설정 바 — 시각 숨김 (새 게임 모달이 대체). DOM은 유지 (telemetry.js 호환) */
    #cfgBar { display: none !important; }
    #cfgBar_LEGACY_KEEP_BELOW {
      position: fixed; top: 6px;
      left: 50%; transform: translateX(-50%);
      z-index: 10000;
      display: flex; align-items: center; gap: 4px;
      background: rgba(10,16,24,0.85);
      border: 2px solid #6a4f2a;
      padding: 4px 8px;
      font-family: 'MonaS', sans-serif;
      font-size: 12px; color: #cfe9ff;
    }
    /* ⚙ 토글 — 모바일에서 평소엔 아이콘만, 누르면 펼침 */
    #cfgToggle {
      background: transparent; border: none;
      color: #ffe9b8; font-size: 16px;
      padding: 0 2px; cursor: pointer; line-height: 1;
    }
    #cfgBar.collapsed { padding: 4px 6px; }
    #cfgBar.collapsed > *:not(#cfgToggle) { display: none !important; }
    #cfgBar input {
      background: #1a2430; border: 1px solid #6a4f2a;
      color: #ffe9b8; font-family: 'MonaS', sans-serif;
      font-size: 12px; padding: 2px 4px;
    }
    #cfgBar input#cfgName { width: 110px; }
    #cfgBar input#cfgRoom { width: 80px; }
    #cfgBar .sep { color: #6a4f2a; }
    /* 🔊 음소거 토글 — cfgBar 우측 작은 버튼 */
    #cfgMute {
      background: #1a2430; border: 1px solid #6a4f2a;
      color: #ffe9b8; font-family: 'MonaS', sans-serif;
      font-size: 12px; padding: 2px 8px; cursor: pointer;
      margin-left: 4px;
    }
    #cfgMute:hover { background: #2a3a4a; }
    #cfgMute.muted { color: #888; }

    /* ─── 인쇄용 보고서 (평소엔 숨김, 인쇄 시에만 보임) ─────── */
    #printReport {
      display: none;
      font-family: 'Malgun Gothic', 'MonaS', sans-serif;
      color: #1a1a1a;
      background: #fff;
    }
    @media print {
      /* 게임 화면·CRT·cfgBar 모두 숨기고 보고서만 인쇄 */
      #game, #vignette, #crt-overlay, #cfgBar, .preload-font, #docModal {
        display: none !important;
      }
      html, body { background: #fff !important; overflow: visible !important; height: auto !important; }
      #printReport { display: block !important; }
      /* A4 여백 */
      @page { size: A4; margin: 18mm; }
    }
    /* 인쇄 보고서 본문 스타일 (.pr-doc 기준 — 인쇄 + 화면 모달 공용) */
    .pr-doc {
      max-width: 720px; margin: 0 auto; padding: 20px;
      font-size: 13px; line-height: 1.7;
      color: #1a1a1a; background: #fff;
      font-family: 'Malgun Gothic', 'MonaS', sans-serif;
    }
    .pr-doc h1 {
      font-size: 22px; text-align: center; margin: 0 0 4px 0;
      color: #6a4f2a; border-bottom: 3px double #6a4f2a; padding-bottom: 6px;
    }
    .pr-doc .pr-meta {
      text-align: center; font-size: 12px; color: #555;
      margin-bottom: 14px;
    }
    .pr-doc h2 {
      font-size: 14px; color: #6a4f2a; margin: 14px 0 4px 0;
      border-left: 5px solid #c9a36b; padding: 2px 8px; background: #fdf6e7;
    }
    .pr-doc ul { margin: 4px 0 8px 22px; padding: 0; }
    .pr-doc li { margin: 2px 0; }
    .pr-doc .chain {
      background: #f0f8e0; padding: 8px 12px;
      border-left: 3px solid #7fd07f; margin: 4px 0;
      font-weight: bold;
    }
    .pr-doc blockquote {
      border-left: 3px solid #6fb7d6; margin: 6px 0;
      padding: 4px 12px; background: #eef6fc;
      font-style: italic; color: #2a4a6a;
    }
    /* 학생 본인이 쓴 한 문장 — 시각 강조 */
    .pr-doc blockquote.user-quote {
      border-left: 4px solid #c9a36b;
      background: linear-gradient(90deg, #fff8e1, #fffefa);
      color: #3a2410; font-style: normal; font-weight: 500;
      padding: 8px 14px; margin: 6px 0 10px 0;
      box-shadow: 0 1px 3px rgba(160, 110, 30, 0.15);
    }
    .pr-doc .user-quote-label {
      display: inline-block; font-size: 11px; font-weight: bold;
      color: #6a4f2a; letter-spacing: 0.5px; margin-bottom: 4px;
    }
    .pr-doc table {
      width: 100%; border-collapse: collapse; margin: 4px 0 8px 0;
      font-size: 12px;
    }
    .pr-doc table td, .pr-doc table th {
      border: 1px solid #c9a36b; padding: 4px 8px;
    }
    .pr-doc table th {
      background: #fdf6e7; color: #6a4f2a; font-weight: bold;
    }
    /* P.E.A.C.E. 종합 평가 표 — UN 블루 톤 강조 */
    .pr-doc h2.peace-eval {
      border-left-color: #1e4a8a; background: #e7f0fa; color: #1e4a8a;
    }
    .pr-doc .peace-grade-badge {
      display: inline-block; padding: 4px 12px; border-radius: 4px;
      font-size: 14px; font-weight: bold; margin-left: 8px;
      background: #1e4a8a; color: #fff;
    }
    .pr-doc .peace-grade-S { background: #d4af37; }
    .pr-doc .peace-grade-A { background: #2e8b57; }
    .pr-doc .peace-grade-B { background: #4a7eb8; }
    .pr-doc .peace-grade-C { background: #888; }
    .pr-doc .sign {
      text-align: right; margin-top: 18px; font-size: 12px; color: #555;
    }
    .pr-doc .stars { color: #d49a30; letter-spacing: 1px; }
    /* UN 로고 (CSS만으로 단순 표현) */
    .pr-doc .un-logo {
      display: inline-block; vertical-align: middle; margin-right: 8px;
      width: 28px; height: 28px; border-radius: 50%;
      background: #1e4a8a; color: #fff; text-align: center;
      line-height: 28px; font-size: 16px; font-weight: bold;
    }

    /* ── 보고서/연설문 화면 모달 (모바일·APK에서 인쇄 대체: 읽기+스크린샷) ── */
    #docModal {
      display: none; position: fixed; inset: 0; z-index: 30000;
      background: rgba(0,0,0,0.78);
      flex-direction: column; align-items: center;
      font-family: 'MonaS', 'Malgun Gothic', sans-serif;
    }
    #docModal.show { display: flex; }
    #docModalBar {
      width: 100%; box-sizing: border-box;
      display: flex; gap: 8px; align-items: center; justify-content: center;
      flex-wrap: wrap;
      padding: 8px 12px; background: #10202e; border-bottom: 2px solid #6fb7d6;
    }
    #docModalBar .dm-title {
      color: #ffe9b8; font-size: 14px; font-weight: bold; margin-right: auto;
    }
    #docModalBar .dm-hint { color: #9fb5d2; font-size: 11px; width: 100%;
      text-align: center; order: 3; }
    #docModalBar button {
      font-family: inherit; font-size: 13px; font-weight: bold;
      padding: 8px 14px; border: 2px solid; border-radius: 6px; cursor: pointer;
    }
    #dmPrint { background: #2e6b58; color: #fff; border-color: #ffe9b8; }
    #dmClose { background: #2b3a52; color: #dff1ff; border-color: #6fb7d6; }
    #docModalBody {
      flex: 1; width: 100%; max-width: 820px; box-sizing: border-box;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      background: #fff; margin: 0 auto;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="vignette"></div>
  <div id="crt-overlay"></div>

  <!-- 참가 설정 (시각 숨김 — telemetry.js가 cfgName/cfgRoom DOM을 읽기 때문에 유지) -->
  <div id="cfgBar">
    <button id="cfgToggle" title="설정 펼치기/접기">⚙</button>
    <span>이름(학번)</span>
    <input id="cfgName" maxlength="14" placeholder="예: 3-12 홍길동" />
    <span class="sep">|</span>
    <span>교실</span>
    <input id="cfgRoom" maxlength="16" value="aralsea-1" />
    <button id="cfgMute" title="음향 설정">🔊</button>
  </div>

  <!-- 새 게임 입력 모달 (TitleScene 새 게임 클릭 시 표시) -->
  <div id="newGameModal" style="display:none; position:fixed; inset:0; z-index:20000;
       background:rgba(0,0,0,0.78); align-items:center; justify-content:center;">
    <div style="background:#10202e; border:2px solid #6fb7d6; box-shadow:0 8px 24px rgba(0,0,0,0.6);
         padding:28px 32px; max-width:440px; width:90%; font-family:'MonaS',sans-serif;
         color:#dff1ff;">
      <h2 style="margin:0 0 4px; font-size:20px; color:#ffe082; font-weight:bold; text-align:center;">
        🎓  새 게임 시작
      </h2>
      <p style="margin:6px 0 18px; font-size:12px; color:#a8c4dc; text-align:center; line-height:1.5;">
        UN 조사관으로 활동할 정보를 입력하세요.<br>
        <span style="color:#7aa6c8;">(교실 번호는 담당 선생님이 안내합니다)</span>
      </p>
      <label style="display:block; font-size:12px; color:#cfe9ff; margin-bottom:4px;">
        이름(학번)
      </label>
      <input id="newGameName" type="text" maxlength="14"
             placeholder="예: 3-12 홍길동"
             style="width:100%; box-sizing:border-box; padding:8px 10px;
                    background:#1a2430; border:1px solid #6a4f2a; color:#ffe9b8;
                    font-family:'MonaS',sans-serif; font-size:14px; margin-bottom:14px;" />
      <label style="display:block; font-size:12px; color:#cfe9ff; margin-bottom:4px;">
        교실 번호
      </label>
      <input id="newGameRoom" type="text" maxlength="16"
             placeholder="예: aralsea-1"
             style="width:100%; box-sizing:border-box; padding:8px 10px;
                    background:#1a2430; border:1px solid #6a4f2a; color:#ffe9b8;
                    font-family:'MonaS',sans-serif; font-size:14px; margin-bottom:20px;" />
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button id="newGameCancel" style="padding:8px 18px; background:#4a3a22; color:#ffe9b8;
                border:1px solid #c9a36b; cursor:pointer; font-family:'MonaS',sans-serif;
                font-size:13px;">← 취소</button>
        <button id="newGameStart" style="padding:8px 22px; background:#2e6b58; color:#fff;
                border:1px solid #ffe9b8; cursor:pointer; font-family:'MonaS',sans-serif;
                font-size:13px; font-weight:bold;">▶ 시작</button>
      </div>
    </div>
  </div>

  <!-- 공통 텍스트 입력 모달 — 단서 자유 입력·다짐·자기성찰 (모바일 prompt() 대체) -->
  <div id="textInputModal" style="display:none; position:fixed; inset:0; z-index:20000;
       background:rgba(0,0,0,0.82); align-items:center; justify-content:center; padding:16px;">
    <div id="textInputBox" style="background:#10202e; border:2px solid #c9a36b; box-shadow:0 8px 24px rgba(0,0,0,0.6);
         padding:22px 24px; max-width:480px; width:94%; max-height:92vh; overflow:auto;
         font-family:'MonaS',sans-serif; color:#dff1ff;">
      <h2 id="textInputTitle" style="margin:0 0 4px; font-size:18px; color:#ffe082;
          font-weight:bold; text-align:center;">💭 입력</h2>
      <p id="textInputSubtitle" style="margin:6px 0 14px; font-size:13px; color:#cfe9ff;
         text-align:center; line-height:1.5;"></p>
      <div id="textInputBody" style="display:flex; flex-wrap:wrap; gap:16px; align-items:stretch;">
        <!-- 좌: 모아둔 단서 종이 (clues 전달 시에만 표시) -->
        <div id="textInputClues" style="display:none; flex:1 1 280px; min-width:0;
             max-height:320px; overflow-y:auto; background:#0c1622;
             border:1px solid #6a4f2a; border-radius:6px; padding:12px 14px;"></div>
        <!-- 우: 든 생각 메모 -->
        <div style="flex:1 1 280px; min-width:0; display:flex; flex-direction:column;">
          <textarea id="textInputArea" maxlength="200" rows="6"
            placeholder="여기에 입력하세요"
            style="width:100%; box-sizing:border-box; padding:10px;
                   background:#1a2430; border:1px solid #6a4f2a; color:#ffe9b8;
                   font-family:'MonaS-Text','MonaS',sans-serif; font-size:14px;
                   resize:vertical; min-height:120px; flex:1; margin-bottom:8px;"></textarea>
          <div style="text-align:right; font-size:11px; color:#7aa6c8;">
            <span id="textInputCount">0</span> / <span id="textInputMax">200</span> 자
          </div>
        </div>
      </div>
      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
        <button id="textInputCancel" style="padding:8px 18px; background:#4a3a22; color:#ffe9b8;
                border:1px solid #c9a36b; cursor:pointer; font-family:'MonaS',sans-serif;
                font-size:13px;">← 건너뛰기</button>
        <button id="textInputConfirm" style="padding:8px 24px; background:#2e6b58; color:#fff;
                border:1px solid #ffe9b8; cursor:pointer; font-family:'MonaS',sans-serif;
                font-size:13px; font-weight:bold;">✓ 저장</button>
      </div>
    </div>
  </div>

  <!-- 인쇄용 보고서 컨테이너 — buildSent에서 동적으로 채움 -->
  <div id="printReport"></div>

  <!-- 보고서/연설문 화면 모달 — 인쇄(브라우저) + 이미지 저장·공유(APK/모바일) -->
  <div id="docModal">
    <div id="docModalBar">
      <span class="dm-title">📄 문서 보기</span>
      <button id="dmSave">🖼 이미지로 저장</button>
      <button id="dmPrint">🖨 인쇄 / PDF</button>
      <button id="dmClose">✕ 닫기</button>
      <span class="dm-hint">이미지로 저장하면 갤러리·파일로 보관하거나 공유할 수 있어요.</span>
    </div>
    <div id="docModalBody"></div>
  </div>
  <script>
    // 보고서/연설문을 화면 모달로 표시.
    //  · 데스크톱/모바일 브라우저: '인쇄/PDF'(window.print) + '이미지로 저장'(다운로드)
    //  · APK(안드로이드 WebView): window.print가 막히므로 '이미지로 저장'을 Capacitor
    //    Filesystem+Share 로 처리(공유 시트에서 갤러리·파일 저장·전송). 인쇄 버튼은 숨김.
    (function () {
      var modal = document.getElementById('docModal');
      var body  = document.getElementById('docModalBody');
      var btnP  = document.getElementById('dmPrint');
      var btnS  = document.getElementById('dmSave');
      var btnC  = document.getElementById('dmClose');
      var hint  = document.querySelector('#docModalBar .dm-hint');

      function isNative() {
        return !!(window.Capacitor && window.Capacitor.isNativePlatform &&
                  window.Capacitor.isNativePlatform());
      }
      function close() { modal.classList.remove('show'); body.innerHTML = ''; }

      window.openDocModal = function (title) {
        var src = document.getElementById('printReport');
        body.innerHTML = src ? src.innerHTML : '';
        body.scrollTop = 0;
        var t = document.querySelector('#docModalBar .dm-title');
        if (t && title) t.textContent = title;
        // APK(네이티브)에서는 인쇄가 막혀 무반응 → 인쇄 버튼 숨기고 이미지 저장만 노출
        if (isNative()) {
          btnP.style.display = 'none';
          hint.textContent = '이미지로 저장 → 안드로이드 공유 시트에서 갤러리·파일 저장 또는 전송하세요.';
        } else {
          btnP.style.display = '';
          hint.textContent = '이미지로 저장하면 파일로 보관하거나 공유할 수 있어요. (PC·브라우저는 인쇄/PDF도 가능)';
        }
        modal.classList.add('show');
      };

      btnC.addEventListener('click', close);
      btnP.addEventListener('click', function () {
        try { window.print(); }
        catch (e) { alert('이 기기에서는 인쇄가 지원되지 않습니다. 「이미지로 저장」을 이용하세요.'); }
      });

      // 보고서를 이미지(PNG)로 — html2canvas 렌더 후 APK는 공유, 브라우저는 다운로드
      btnS.addEventListener('click', function () {
        if (typeof html2canvas !== 'function') {
          alert('이미지 변환 모듈을 불러오지 못했습니다. 화면을 캡처(스크린샷)해 저장하세요.');
          return;
        }
        var label = btnS.textContent;
        btnS.disabled = true; btnS.textContent = '⏳ 만드는 중...';
        // .pr-doc 요소를 캡처(여백 포함 흰 배경). 스크롤 전체 높이를 담기 위해 요소 기준 렌더.
        var target = body.querySelector('.pr-doc') || body;
        html2canvas(target, { backgroundColor: '#ffffff', scale: 2, useCORS: true })
          .then(function (canvas) {
            var dataUrl = canvas.toDataURL('image/png');
            var fname = 'PEACE_' + Date.now() + '.png';
            if (isNative() && window.Capacitor.Plugins &&
                window.Capacitor.Plugins.Filesystem && window.Capacitor.Plugins.Share) {
              var FS = window.Capacitor.Plugins.Filesystem;
              var SH = window.Capacitor.Plugins.Share;
              var base64 = dataUrl.split(',')[1];
              return FS.writeFile({ path: fname, data: base64, directory: 'CACHE' })
                .then(function () { return FS.getUri({ path: fname, directory: 'CACHE' }); })
                .then(function (res) {
                  return SH.share({ title: 'P.E.A.C.E.', text: 'P.E.A.C.E. 학습 문서',
                    url: res.uri, dialogTitle: '문서 저장·공유' });
                });
            } else {
              var a = document.createElement('a');
              a.href = dataUrl; a.download = fname;
              document.body.appendChild(a); a.click(); a.remove();
            }
          })
          .catch(function (e) {
            // 공유 취소는 오류가 아님 — 메시지에 cancel 포함 시 조용히 무시
            var msg = (e && e.message) ? e.message : String(e);
            if (!/cancel/i.test(msg)) {
              alert('이미지 저장 중 문제가 발생했어요: ' + msg + '\n화면 캡처(스크린샷)로도 저장할 수 있어요.');
            }
          })
          .then(function () { btnS.disabled = false; btnS.textContent = label; });
      });
    })();
  </script>

  <!-- 참가 설정값 localStorage 저장/복원 -->
  <script>
    (function () {
      var n = document.getElementById('cfgName');
      var r = document.getElementById('cfgRoom');
      try {
        if (localStorage.getItem('aral_name')) n.value = localStorage.getItem('aral_name');
        if (localStorage.getItem('aral_room')) r.value = localStorage.getItem('aral_room');
      } catch (e) {}
      function save() {
        try {
          localStorage.setItem('aral_name', n.value);
          localStorage.setItem('aral_room', r.value);
        } catch (e) {}
      }
      n.addEventListener('change', save);
      r.addEventListener('change', save);

      // 🔊 음소거 토글 — audio.js 가 로드된 후에만 동작
      var muteBtn = document.getElementById('cfgMute');
      function refreshMute() {
        if (!window.SFX || !muteBtn) return;
        if (window.SFX.isMuted()) {
          muteBtn.textContent = '🔇';
          muteBtn.classList.add('muted');
        } else {
          muteBtn.textContent = '🔊';
          muteBtn.classList.remove('muted');
        }
      }
      if (muteBtn) {
        muteBtn.addEventListener('click', function () {
          // 음향 설정 패널(음소거 + BGM·효과음 음량) 열기.
          // 게임이 아직 로드 전이면 단순 음소거 토글로 폴백.
          if (window.PEACE && window.PEACE.openSound) {
            window.PEACE.openSound(refreshMute);
          } else if (window.SFX) {
            window.SFX.toggleMute();
            refreshMute();
          }
        });
      }
      // audio.js 가 늦게 로드돼도 잘 보이도록 약간 지연 후 갱신
      setTimeout(refreshMute, 100);

      // 모바일/좁은 화면에서는 cfgBar를 기본 접힘 상태로
      var cfgBar = document.getElementById('cfgBar');
      var cfgToggle = document.getElementById('cfgToggle');
      var isCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      var isNarrow = window.innerWidth < 1024;
      var forcedMobile = /[?&]mobile=1\b/.test(location.search || '');
      if (isCoarse || isNarrow || forcedMobile) {
        cfgBar.classList.add('collapsed');
      }
      if (cfgToggle) {
        cfgToggle.addEventListener('click', function () {
          cfgBar.classList.toggle('collapsed');
        });
      }
    })();

    // ── 새 게임 입력 모달 — window.PEACE.openNewGameModal(onConfirm) ──
    // TitleScene 새 게임 버튼이 호출. 확인 시 onConfirm(name, room) 호출.
    (function () {
      window.PEACE = window.PEACE || {};
      const modal = document.getElementById('newGameModal');
      const nameInp = document.getElementById('newGameName');
      const roomInp = document.getElementById('newGameRoom');
      const startBtn = document.getElementById('newGameStart');
      const cancelBtn = document.getElementById('newGameCancel');
      if (!modal || !nameInp || !roomInp || !startBtn || !cancelBtn) return;

      let pendingOnConfirm = null;

      function show() { modal.style.display = 'flex'; }
      function hide() { modal.style.display = 'none'; pendingOnConfirm = null; }

      function confirm() {
        const name = nameInp.value.trim();
        const room = roomInp.value.trim() || 'aralsea-1';
        // cfgName/cfgRoom DOM에 반영 (telemetry.js 호환)
        const cfgN = document.getElementById('cfgName');
        const cfgR = document.getElementById('cfgRoom');
        if (cfgN) cfgN.value = name;
        if (cfgR) cfgR.value = room;
        try { localStorage.setItem('aral_name', name); } catch (e) {}
        try { localStorage.setItem('aral_room', room); } catch (e) {}
        const cb = pendingOnConfirm;
        hide();
        if (typeof cb === 'function') cb(name, room);
      }

      startBtn.addEventListener('click', confirm);
      cancelBtn.addEventListener('click', hide);
      nameInp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); roomInp.focus(); }
        if (e.key === 'Escape') hide();
      });
      roomInp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); confirm(); }
        if (e.key === 'Escape') hide();
      });

      window.PEACE.openNewGameModal = function (onConfirm) {
        pendingOnConfirm = onConfirm;
        // 이전 값 미리 채움
        let prevName = '', prevRoom = '';
        try {
          prevName = localStorage.getItem('aral_name') || '';
          prevRoom = localStorage.getItem('aral_room') || 'aralsea-1';
        } catch (e) { prevRoom = 'aralsea-1'; }
        nameInp.value = prevName;
        roomInp.value = prevRoom;
        show();
        // 약간 지연 후 첫 입력 포커스
        setTimeout(() => nameInp.focus(), 80);
      };
    })();

    // ── 공통 텍스트 입력 모달 — window.PEACE.openTextInputModal(opts, onConfirm) ──
    // 모바일 브라우저의 window.prompt() 차단·억제 문제 픽스용 (RRRRR-1, YY-1)
    // opts: { title, subtitle, placeholder, maxLength, initial }
    // onConfirm(text) — 사용자가 저장 시 호출. 취소하면 호출 안 함.
    (function () {
      window.PEACE = window.PEACE || {};
      const modal = document.getElementById('textInputModal');
      const titleEl = document.getElementById('textInputTitle');
      const subtitleEl = document.getElementById('textInputSubtitle');
      const area = document.getElementById('textInputArea');
      const countEl = document.getElementById('textInputCount');
      const maxEl = document.getElementById('textInputMax');
      const confirmBtn = document.getElementById('textInputConfirm');
      const cancelBtn = document.getElementById('textInputCancel');
      if (!modal || !area || !confirmBtn || !cancelBtn) return;

      let pendingOnConfirm = null;
      let pendingOnCancel = null;
      let currentMax = 200;
      const cluesEl = document.getElementById('textInputClues');
      const boxEl = document.getElementById('textInputBox');
      const esc = (s) => String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      function hide() {
        modal.style.display = 'none';
        pendingOnConfirm = null; pendingOnCancel = null;
      }
      function doCancel() {
        const cb = pendingOnCancel; hide();
        if (typeof cb === 'function') cb();
      }
      function updateCount() {
        countEl.textContent = String((area.value || '').length);
      }

      area.addEventListener('input', updateCount);
      // Enter — 줄바꿈 허용 (textarea), Ctrl+Enter로 확인
      area.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.preventDefault(); doCancel(); }
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault(); confirmBtn.click();
        }
      });

      confirmBtn.addEventListener('click', () => {
        const text = (area.value || '').trim().slice(0, currentMax);
        const cb = pendingOnConfirm;
        hide();
        if (typeof cb === 'function') cb(text);
      });
      cancelBtn.addEventListener('click', doCancel);

      window.PEACE.openTextInputModal = function (opts, onConfirm) {
        opts = opts || {};
        titleEl.textContent = opts.title || '💭 입력';
        subtitleEl.innerHTML = opts.subtitle || '';
        area.placeholder = opts.placeholder || '여기에 입력하세요';
        currentMax = opts.maxLength || 200;
        area.maxLength = currentMax;
        maxEl.textContent = String(currentMax);
        area.value = opts.initial || '';
        updateCount();
        // 노트형 — clues 배열이 있으면 좌측 "모아둔 단서 종이" 표시 + 모달 넓힘
        if (cluesEl && boxEl) {
          if (Array.isArray(opts.clues) && opts.clues.length) {
            let html = '<div style="font-size:12px; color:#e8b86a; font-weight:bold; margin-bottom:10px;">' + esc(opts.cluesTitle || '📑 이 장소에서 모은 단서') + '</div>';
            opts.clues.forEach(function (c) {
              const badge = c.areaLabel
                ? '<span style="display:inline-block; font-size:10px; color:#0a1828; background:' +
                  (c.areaColor || '#6fb7d6') + '; padding:1px 6px; border-radius:3px; margin-right:6px;">' +
                  esc(c.areaLabel) + '</span>'
                : '';
              html += '<div style="margin-bottom:11px; line-height:1.5;">' +
                '<div style="font-size:13px; color:#ffe9b8; font-weight:bold;">● ' + esc(c.name) + '</div>' +
                '<div style="font-size:11px; color:#cfe9ff; margin-top:2px;">' + badge + esc(c.desc) + '</div>' +
                '</div>';
            });
            cluesEl.innerHTML = html;
            cluesEl.style.display = 'block';
            boxEl.style.maxWidth = '760px';
          } else {
            cluesEl.style.display = 'none';
            cluesEl.innerHTML = '';
            boxEl.style.maxWidth = '480px';
          }
        }
        pendingOnConfirm = onConfirm;
        pendingOnCancel = opts.onCancel || null;
        modal.style.display = 'flex';
        setTimeout(() => area.focus(), 80);
      };
    })();
  </script>

  <script>
    // 서비스 워커 등록 — HTTPS(또는 localhost)에서만 등록됨
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      // 자동 업데이트: 새 SW가 활성화되면 1회만 자동 새로고침 → 항상 최신.
      //  · hadController=false(첫 방문/첫 설치)면 새로고침 생략 (불필요한 첫 reload 방지)
      //  · refreshing 플래그로 중복 reload 방지
      //  · 새로고침 후엔 sw.js가 동일 → 재설치/재활성 없음 → controllerchange 미발생 → 루프 없음
      var hadController = !!navigator.serviceWorker.controller;
      var swRefreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (swRefreshing || !hadController) return;
        swRefreshing = true;
        window.location.reload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // 탭이 떠 있는 동안에도 주기적으로 업데이트 확인 (선택)
          try { reg.update(); } catch (e) {}
        }).catch(function () {});
      });
    }
  </script>
