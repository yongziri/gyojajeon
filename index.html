<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1a0e08" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="assets/icons/icon-192.png" />
  <title>P.E.A.C.E. — 통(通)하는 국제 분쟁 탐구하기</title>
  <style>
    /* MonaS 픽셀 한글 폰트 (Monad ABXY, SIL OFL 라이선스 — 자유 사용)
       · MonaS12TextKR : 한국어 본문 최적화 12px
       · MonaS12-Bold  : 제목·강조 (영문+일부 한글, 한글은 TextKR로 fallback) */
    @font-face {
      font-family: 'MonaS';
      src: url('assets/fonts/MonaS12TextKR.woff2') format('woff2');
      font-weight: normal; font-style: normal; font-display: block;
    }
    @font-face {
      font-family: 'MonaS';
      src: url('assets/fonts/MonaS12-Bold.woff2') format('woff2');
      font-weight: bold; font-style: normal; font-display: block;
    }
    /* 영문 강조용 (한글이 없는 부분은 MonaS12 사용) */
    @font-face {
      font-family: 'MonaS12';
      src: url('assets/fonts/MonaS12.woff2') format('woff2');
      font-weight: normal; font-style: normal; font-display: block;
    }
    @font-face {
      font-family: 'MonaS12';
      src: url('assets/fonts/MonaS12-Bold.woff2') format('woff2');
      font-weight: bold; font-style: normal; font-display: block;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #3a2f1f;
      overflow: hidden;
      font-family: 'MonaS', 'Malgun Gothic', sans-serif;
      /* 8비트 픽셀 렌더링 보장 */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
      /* iOS Safari/Chrome 노치·홈바 안전영역 */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-sizing: border-box;
    }

    /* 게임 컨테이너 — 8비트 CRT 느낌의 무대 */
    #game {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      /* 모바일 주소창 변동에 강한 동적 viewport */
      width: 100dvw;
      height: 100dvh;
      /* 좌우 여백 — 게임 갈색 톤과 자연스럽게 이어짐 */
      background:
        radial-gradient(ellipse at center,
          rgba(40,30,15,0) 0%,
          rgba(0,0,0,0.35) 100%),
        #3a2f1f;
    }
    #game canvas {
      image-rendering: pixelated !important;
      image-rendering: crisp-edges !important;
      /* 약한 채도/대비 보정으로 NES 톤 흉내 */
      filter: contrast(1.08) saturate(1.10);
      /* Phaser autoCenter 백업 — 부모 안에서 강제 중앙 정렬 */
      position: absolute !important;
      inset: 0 !important;
      margin: auto !important;
      display: block !important;
    }

    /* 스캔라인 — 게임 캔버스 위에 가는 가로줄 */
    #crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(0,0,0,0.18) 0px,
          rgba(0,0,0,0.18) 1px,
          rgba(0,0,0,0.00) 2px,
          rgba(0,0,0,0.00) 3px
        );
      mix-blend-mode: multiply;
    }
    /* 끝부분 살짝 어둡게 (비네트) */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0) 50%,
        rgba(0,0,0,0.55) 100%);
    }

    .preload-font {
      position: absolute; left: -9999px; top: -9999px; visibility: hidden;
    }

    /* 참가 설정 바 — 교사 대시보드 연동용 (상단 중앙) */
    #cfgBar {
      position: fixed; top: 6px;
      left: 50%; transform: translateX(-50%);
      z-index: 10000;
      display: flex; align-items: center; gap: 4px;
      background: rgba(10,16,24,0.85);
      border: 2px solid #6a4f2a;
      padding: 4px 8px;
      font-family: 'MonaS', sans-serif;
      font-size: 12px; color: #cfe9ff;
    }
    /* ⚙ 토글 — 모바일에서 평소엔 아이콘만, 누르면 펼침 */
    #cfgToggle {
      background: transparent; border: none;
      color: #ffe9b8; font-size: 16px;
      padding: 0 2px; cursor: pointer; line-height: 1;
    }
    #cfgBar.collapsed { padding: 4px 6px; }
    #cfgBar.collapsed > *:not(#cfgToggle) { display: none !important; }
    #cfgBar input {
      background: #1a2430; border: 1px solid #6a4f2a;
      color: #ffe9b8; font-family: 'MonaS', sans-serif;
      font-size: 12px; padding: 2px 4px;
    }
    #cfgBar input#cfgName { width: 110px; }
    #cfgBar input#cfgRoom { width: 80px; }
    #cfgBar .sep { color: #6a4f2a; }
    /* 🔊 음소거 토글 — cfgBar 우측 작은 버튼 */
    #cfgMute {
      background: #1a2430; border: 1px solid #6a4f2a;
      color: #ffe9b8; font-family: 'MonaS', sans-serif;
      font-size: 12px; padding: 2px 8px; cursor: pointer;
      margin-left: 4px;
    }
    #cfgMute:hover { background: #2a3a4a; }
    #cfgMute.muted { color: #888; }

    /* ─── 인쇄용 보고서 (평소엔 숨김, 인쇄 시에만 보임) ─────── */
    #printReport {
      display: none;
      font-family: 'Malgun Gothic', 'MonaS', sans-serif;
      color: #1a1a1a;
      background: #fff;
    }
    @media print {
      /* 게임 화면·CRT·cfgBar 모두 숨기고 보고서만 인쇄 */
      #game, #vignette, #crt-overlay, #cfgBar, .preload-font {
        display: none !important;
      }
      html, body { background: #fff !important; overflow: visible !important; height: auto !important; }
      #printReport { display: block !important; }
      /* A4 여백 */
      @page { size: A4; margin: 18mm; }
    }
    /* 인쇄 보고서 본문 스타일 */
    #printReport .pr-doc {
      max-width: 720px; margin: 0 auto; padding: 20px;
      font-size: 13px; line-height: 1.7;
    }
    #printReport h1 {
      font-size: 22px; text-align: center; margin: 0 0 4px 0;
      color: #6a4f2a; border-bottom: 3px double #6a4f2a; padding-bottom: 6px;
    }
    #printReport .pr-meta {
      text-align: center; font-size: 12px; color: #555;
      margin-bottom: 14px;
    }
    #printReport h2 {
      font-size: 14px; color: #6a4f2a; margin: 14px 0 4px 0;
      border-left: 5px solid #c9a36b; padding: 2px 8px; background: #fdf6e7;
    }
    #printReport ul { margin: 4px 0 8px 22px; padding: 0; }
    #printReport li { margin: 2px 0; }
    #printReport .chain {
      background: #f0f8e0; padding: 8px 12px;
      border-left: 3px solid #7fd07f; margin: 4px 0;
      font-weight: bold;
    }
    #printReport blockquote {
      border-left: 3px solid #6fb7d6; margin: 6px 0;
      padding: 4px 12px; background: #eef6fc;
      font-style: italic; color: #2a4a6a;
    }
    /* 학생 본인이 쓴 한 문장 — 시각 강조 */
    #printReport blockquote.user-quote {
      border-left: 4px solid #c9a36b;
      background: linear-gradient(90deg, #fff8e1, #fffefa);
      color: #3a2410; font-style: normal; font-weight: 500;
      padding: 8px 14px; margin: 6px 0 10px 0;
      box-shadow: 0 1px 3px rgba(160, 110, 30, 0.15);
    }
    #printReport .user-quote-label {
      display: inline-block; font-size: 11px; font-weight: bold;
      color: #6a4f2a; letter-spacing: 0.5px; margin-bottom: 4px;
    }
    #printReport table {
      width: 100%; border-collapse: collapse; margin: 4px 0 8px 0;
      font-size: 12px;
    }
    #printReport table td, #printReport table th {
      border: 1px solid #c9a36b; padding: 4px 8px;
    }
    #printReport table th {
      background: #fdf6e7; color: #6a4f2a; font-weight: bold;
    }
    /* P.E.A.C.E. 종합 평가 표 — UN 블루 톤 강조 */
    #printReport h2.peace-eval {
      border-left-color: #1e4a8a; background: #e7f0fa; color: #1e4a8a;
    }
    #printReport .peace-grade-badge {
      display: inline-block; padding: 4px 12px; border-radius: 4px;
      font-size: 14px; font-weight: bold; margin-left: 8px;
      background: #1e4a8a; color: #fff;
    }
    #printReport .peace-grade-S { background: #d4af37; }
    #printReport .peace-grade-A { background: #2e8b57; }
    #printReport .peace-grade-B { background: #4a7eb8; }
    #printReport .peace-grade-C { background: #888; }
    #printReport .sign {
      text-align: right; margin-top: 18px; font-size: 12px; color: #555;
    }
    #printReport .stars { color: #d49a30; letter-spacing: 1px; }
    /* UN 로고 (CSS만으로 단순 표현) */
    #printReport .un-logo {
      display: inline-block; vertical-align: middle; margin-right: 8px;
      width: 28px; height: 28px; border-radius: 50%;
      background: #1e4a8a; color: #fff; text-align: center;
      line-height: 28px; font-size: 16px; font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="vignette"></div>
  <div id="crt-overlay"></div>

  <!-- 참가 설정 — 비워둬도 게임은 정상 동작 (교사 대시보드 연동 시에만 사용) -->
  <div id="cfgBar">
    <button id="cfgToggle" title="설정 펼치기/접기">⚙</button>
    <span>참가번호</span>
    <input id="cfgName" maxlength="14" placeholder="예: 3-12 홍길동" />
    <span class="sep">|</span>
    <span>교실</span>
    <input id="cfgRoom" maxlength="16" value="aralsea-1" />
    <button id="cfgMute" title="효과음 음소거 토글">🔊</button>
  </div>

  <!-- 인쇄용 보고서 컨테이너 — buildSent에서 동적으로 채움 -->
  <div id="printReport"></div>

  <!-- 글리프 미리 로드 -->
  <div class="preload-font" style="font-family: 'MonaS';">한글 로드 ABC 123</div>
  <div class="preload-font" style="font-family: 'MonaS'; font-weight: bold;">한글 로드 ABC 123</div>
  <div class="preload-font" style="font-family: 'MonaS12';">한글 로드 ABC 123</div>
  <div class="preload-font" style="font-family: 'MonaS12'; font-weight: bold;">한글 로드 ABC 123</div>

  <!-- 참가 설정값 localStorage 저장/복원 -->
  <script>
    (function () {
      var n = document.getElementById('cfgName');
      var r = document.getElementById('cfgRoom');
      try {
        if (localStorage.getItem('aral_name')) n.value = localStorage.getItem('aral_name');
        if (localStorage.getItem('aral_room')) r.value = localStorage.getItem('aral_room');
      } catch (e) {}
      function save() {
        try {
          localStorage.setItem('aral_name', n.value);
          localStorage.setItem('aral_room', r.value);
        } catch (e) {}
      }
      n.addEventListener('change', save);
      r.addEventListener('change', save);

      // 🔊 음소거 토글 — audio.js 가 로드된 후에만 동작
      var muteBtn = document.getElementById('cfgMute');
      function refreshMute() {
        if (!window.SFX || !muteBtn) return;
        if (window.SFX.isMuted()) {
          muteBtn.textContent = '🔇';
          muteBtn.classList.add('muted');
        } else {
          muteBtn.textContent = '🔊';
          muteBtn.classList.remove('muted');
        }
      }
      if (muteBtn) {
        muteBtn.addEventListener('click', function () {
          if (window.SFX) window.SFX.toggleMute();
          refreshMute();
        });
      }
      // audio.js 가 늦게 로드돼도 잘 보이도록 약간 지연 후 갱신
      setTimeout(refreshMute, 100);

      // 모바일/좁은 화면에서는 cfgBar를 기본 접힘 상태로
      var cfgBar = document.getElementById('cfgBar');
      var cfgToggle = document.getElementById('cfgToggle');
      var isCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      var isNarrow = window.innerWidth < 1024;
      var forcedMobile = /[?&]mobile=1\b/.test(location.search || '');
      if (isCoarse || isNarrow || forcedMobile) {
        cfgBar.classList.add('collapsed');
      }
      if (cfgToggle) {
        cfgToggle.addEventListener('click', function () {
          cfgBar.classList.toggle('collapsed');
        });
      }
    })();
  </script>

  <script src="vendor/phaser.min.js"></script>
  <script src="vendor/mqtt.min.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/telemetry.js"></script>
  <script src="src/dialogue.js"></script>
  <script src="src/cases.js"></script>
  <script src="src/quizzes.js"></script>
  <script src="src/stages.js"></script>
  <script src="src/strings.js"></script>
  <script src="src/game.js"></script>

  <script>
    // 서비스 워커 등록 — HTTPS(또는 localhost)에서만 등록됨
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
